name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-auth-secret-0123456789
      PIN_PEPPER: ci-pin-pepper-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pi-print-server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix pi-print-server
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
